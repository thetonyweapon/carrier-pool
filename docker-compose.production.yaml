services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEMO_MODE: "false"
      AUTH_MODE: ${AUTH_MODE:?AUTH_MODE is required}
      ALLOW_MOCK_AUTH: "false"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?AUTH_AUDIENCE is required}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      SHARED_POOL_READ_ENABLED: ${SHARED_POOL_READ_ENABLED:-false}
      SHARED_POOL_ID_SECRET: ${SHARED_POOL_ID_SECRET:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    command: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --no-server-header"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  edge:
