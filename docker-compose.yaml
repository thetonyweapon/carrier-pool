services:
  db:
    profiles: ["demo"]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: carrier_pool
      POSTGRES_USER: carrier_pool
      POSTGRES_PASSWORD: carrier_pool
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrier_pool -d carrier_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["demo"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carrier_pool:carrier_pool@db:5432/carrier_pool
      DEMO_MODE: "true"
      AUTH_MODE: "mock"
      ALLOW_MOCK_AUTH: "true"
      # Demo-only fallbacks; non-demo settings reject these values.
      AUTH_SECRET: ${AUTH_SECRET:-carrier-pool-compose-demo-auth-secret}
      SHARED_POOL_READ_ENABLED: "true"
      SHARED_POOL_ID_SECRET: ${SHARED_POOL_ID_SECRET:-carrier-pool-compose-demo-shared-secret}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Keep source sync files on the host; the adapter must never modify them.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    command: >-
      sh -c "alembic upgrade head && python -m scripts.bootstrap_demo --root /data
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ingestion-worker:
    profiles: ["demo"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carrier_pool:carrier_pool@db:5432/carrier_pool
      DEMO_MODE: "true"
      AUTH_MODE: "mock"
      ALLOW_MOCK_AUTH: "true"
      AUTH_SECRET: ${AUTH_SECRET:-carrier-pool-compose-demo-auth-secret}
      SHARED_POOL_READ_ENABLED: "true"
      SHARED_POOL_ID_SECRET: ${SHARED_POOL_ID_SECRET:-carrier-pool-compose-demo-shared-secret}
    volumes:
      - ./data:/data:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "scripts.ingestion_worker", "--root", "/data", "--poll-interval", "60"]

  frontend:
    profiles: ["demo"]
    ports:
      - "127.0.0.1:3000:8080"
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 5s
      retries: 3

volumes:
  postgres_data:
