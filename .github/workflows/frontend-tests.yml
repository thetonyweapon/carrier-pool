name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Component and integration tests
        run: npm test -- --coverage
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start demo stack
        working-directory: .
        run: docker compose up --build -d
      - name: Wait for demo stack
        working-directory: .
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/ready >/dev/null \
              && curl --fail --silent http://localhost:3000/api/demo/brokers >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Demo stack did not become ready; backend bootstrap or database readiness failed."
          docker compose ps
          docker compose logs --no-color backend db frontend
          exit 1
      - name: Chromium end-to-end tests
        run: npm run test:e2e -- --project=chromium
      - name: Dump demo stack diagnostics
        if: failure()
        working-directory: .
        run: |
          docker compose ps
          docker compose logs --no-color backend db frontend
      - name: Stop demo stack
        if: always()
        working-directory: .
        run: docker compose down -v
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-artifacts
          path: frontend/test-results
