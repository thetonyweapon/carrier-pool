name: Supply chain checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pip-audit
          pip freeze --exclude-editable > /tmp/backend-requirements.txt
          pip-audit --requirement /tmp/backend-requirements.txt --strict --desc=off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          set +e
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          node scripts/check-production-audit.mjs /tmp/npm-audit.json
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit reported only the explicitly reviewed upstream exception."
          fi
