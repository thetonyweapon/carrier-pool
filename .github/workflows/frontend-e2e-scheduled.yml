name: Frontend scheduled browser tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  browsers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start demo stack
        working-directory: .
        run: docker compose up --build -d
      - name: Wait for demo stack
        working-directory: .
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/demo/brokers; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run browser matrix
        run: npm run test:e2e
      - name: Stop demo stack
        if: always()
        working-directory: .
        run: docker compose down -v
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-playwright-artifacts
          path: frontend/test-results
