name: Frontend scheduled browser tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start demo stack
        working-directory: .
        run: docker compose up --build -d
      - name: Wait for demo stack
        working-directory: .
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/demo/brokers; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run browser matrix
        run: npm run test:e2e
      - name: Stop demo stack
        if: always()
        working-directory: .
        run: docker compose down -v
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-playwright-artifacts
          path: frontend/test-results
