name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: carrier_pool
          POSTGRES_USER: carrier_pool
          POSTGRES_PASSWORD: carrier_pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carrier_pool -d carrier_pool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check
      - name: Upgrade database schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://carrier_pool:carrier_pool@localhost:5432/carrier_pool
          DEMO_MODE: "true"
          AUTH_MODE: mock
          ALLOW_MOCK_AUTH: "true"
          AUTH_SECRET: ci-demo-secret
        run: alembic upgrade head
      - name: Check migration state
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://carrier_pool:carrier_pool@localhost:5432/carrier_pool
          DEMO_MODE: "true"
          AUTH_MODE: mock
          ALLOW_MOCK_AUTH: "true"
          AUTH_SECRET: ci-demo-secret
        run: alembic check
      - name: Run SQLite backend tests
        working-directory: backend
        env:
          HAULDESK_POSTGRES_TEST_URL: postgresql+psycopg://carrier_pool:carrier_pool@localhost:5432/carrier_pool
        run: pytest -m "not postgres"
      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          HAULDESK_POSTGRES_TEST_URL: postgresql+psycopg://carrier_pool:carrier_pool@localhost:5432/carrier_pool
        run: pytest -m postgres
      - name: Run lint
        working-directory: backend
        run: ruff check .
      - name: Check formatting
        working-directory: backend
        run: ruff format --check .
      - name: Validate production documentation
        working-directory: backend
        run: python scripts/validate_documentation.py
